# VS Marketplace / OpenVSX publish tokens for vhash-vscode-ext.
# Copy to: <config_root>/xapp-keys/vhash-vscode-ext/vhash-vscode-ext-secrets.yml
# <config_root> = /etc/xapp-config-root (server) or ~/.config/xapp-config-root (user)

publish:
  default_profile: default
  profiles:
    default:
      azure_devops_pat_for_vsce: ''   # Azure DevOps PAT (vsce publish)
      openvsx_pat: ''                 # OpenVSX access token
